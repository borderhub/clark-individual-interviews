<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="個別インタビューの記録を読む。チーム確認用の共有版。">
  <title>個別インタビューの記録を読む | チーム確認用</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content">本文へ移動</a>
  <header class="site-header">
    <div class="shell header-inner">
      <p class="eyebrow">研究・作品のための記録</p>
      <p class="header-state">チーム確認用・公開プレビュー</p>
    </div>
  </header>
  <main id="content">
    <section class="hero shell" aria-labelledby="page-title">
      <p class="eyebrow">個別インタビュー分析</p>
      <h1 id="page-title">個別インタビューの記録を読む</h1>
      <p class="lede" id="notice"></p>
      <div class="status-note" aria-label="掲載状態">
        <span>チーム確認用の共有版</span>
        <span aria-hidden="true">／</span>
        <span>正式な掲載可否は確認後に判断</span>
      </div>
    </section>

    <section class="shell controls" aria-label="表示の切替">
      <div class="control-group">
        <p class="control-label">見る範囲</p>
        <div class="button-row" id="case-tabs" role="tablist" aria-label="ケースの切替"></div>
      </div>
      <div class="control-group" id="question-control">
        <p class="control-label">問いの核</p>
        <div class="button-row" id="question-tabs" role="tablist" aria-label="問いの切替"></div>
      </div>
      <div class="control-group view-switch">
        <p class="control-label">表示</p>
        <div class="button-row" role="tablist" aria-label="表示の切替">
          <button class="tab" type="button" data-view="record" role="tab" aria-selected="true">記録を読む</button>
          <button class="tab" type="button" data-view="comparison" role="tab" aria-selected="false">ケース比較</button>
        </div>
      </div>
    </section>

    <section class="shell page-content" id="view" aria-live="polite"></section>
  </main>
  <footer class="site-footer">
    <div class="shell"><p>このページは、内容・表現・構成を確認するための共有版です。</p></div>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
