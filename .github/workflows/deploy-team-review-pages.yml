name: Deploy team-review preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/team-review/**'
      - '.github/workflows/deploy-team-review-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/team-review/**'
      - '.github/workflows/deploy-team-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: team-review-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the preview artifact
        run: |
          mkdir -p _site/team-review
          cp -R docs/team-review/individual-interviews _site/team-review/
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0; url=team-review/individual-interviews/">' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
